# No project name: start.sh runs as project agent-box, drive.sh as the
# project it is given (gauge-run-<loop>-<attempt>). Every project gets its
# own networks, proxies and workspace. Claude signs in with a token from an
# env file outside the repo; Codex's auth volumes are shared by name.

# What every agent service shares. Each service adds only its own
# sign-in, so neither agent can read the other's. The home
# (CLAUDE_CONFIG_DIR, CODEX_HOME) is on the /home/node tmpfs and starts
# empty each run (D8, entrypoint.sh): Claude's holds no auth file at all,
# Codex's only its auth.json.
x-agent: &agent
  build: .
  user: "1000:1000"
  read_only: true
  tmpfs:
    - /tmp:exec,size=2g
    - /home/node:uid=1000,gid=1000,mode=0755
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 2048
  mem_limit: 8g
  stdin_open: true
  tty: true

x-auth-sync: &auth-sync
  build: .
  user: "1000:1000"
  read_only: true
  network_mode: none
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 64
  mem_limit: 256m
  entrypoint: ["/usr/local/bin/auth-sync"]

x-agent-env: &agent-env
  BRANCH: ${BRANCH:-}
  GIT_AUTHOR_NAME: ${AGENT_NAME:-}
  GIT_AUTHOR_EMAIL: ${AGENT_EMAIL:-}
  GIT_COMMITTER_NAME: ${AGENT_NAME:-}
  GIT_COMMITTER_EMAIL: ${AGENT_EMAIL:-}
  HTTP_PROXY: http://proxy:3128
  HTTPS_PROXY: http://proxy:3128
  http_proxy: http://proxy:3128
  https_proxy: http://proxy:3128
  NO_PROXY: localhost,127.0.0.1
  no_proxy: localhost,127.0.0.1

services:
  proxy:
    build:
      context: ./proxy
      args:
        BOX_SUBNET: ${BOX_SUBNET:-10.77.0.0/24}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    networks: [egress, box]

  # Codex's proxy: its own allowlist, on a network only codex joins, under
  # the name proxy so the agent environment is the same for both.
  proxy-codex:
    build:
      context: ./proxy
      args:
        ALLOWLIST: allowlist-codex
        BOX_SUBNET: ${BOX_CODEX_SUBNET:-10.77.1.0/24}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    networks:
      egress: {}
      box-codex:
        aliases: [proxy]

  # Signs in with CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`), read
  # from an env file outside every repo. AGENT_BOX_CLAUDE_ENV overrides the
  # path. Not required, so codex runs without it; the entrypoint refuses to
  # start claude with no token. Nothing is written back.
  agent:
    <<: *agent
    depends_on: [proxy]
    networks: [box]
    env_file:
      - path: ${AGENT_BOX_CLAUDE_ENV:-${HOME:?}/.config/rsb/agent-box/claude.env}
        required: false
    environment:
      <<: *agent-env
      CLAUDE_CONFIG_DIR: /home/node/.claude
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      CLAUDE_CODE_DISABLE_AUTO_MEMORY: "1"
      DISABLE_AUTOUPDATER: "1"
    volumes:
      - workspace:/workspace
      - pnpm-store:/home/node/.local/share/pnpm
      - ./bundles:/bundles:ro

  codex:
    <<: *agent
    depends_on: [proxy-codex]
    networks: [box-codex]
    command: ["codex"]
    environment:
      <<: *agent-env
      CODEX_HOME: /home/node/.codex
      AGENT_AUTH: /home/node/.codex/auth.json
    volumes:
      - workspace:/workspace
      - codex-auth:/auth:ro
      - codex-auth-out:/auth-out
      - pnpm-store:/home/node/.local/share/pnpm
      - ./bundles:/bundles:ro

  # Write a Codex run's auth file back to its auth volume, after the
  # container has exited (start.sh runs it). No network, and nothing
  # mounted but Codex's two auth volumes.
  codex-auth-sync:
    <<: *auth-sync
    command: ["auth.json"]
    volumes:
      - codex-auth:/auth
      - codex-auth-out:/auth-out

networks:
  box:
    internal: true
    ipam:
      config:
        - subnet: ${BOX_SUBNET:-10.77.0.0/24}
  box-codex:
    internal: true
    ipam:
      config:
        - subnet: ${BOX_CODEX_SUBNET:-10.77.1.0/24}
  egress: {}

# Codex's auth volumes are external and named, so every project (the
# desk's and each attempt's) uses one sign-in. Create them once; see
# README.md.
volumes:
  workspace: {}
  pnpm-store: {}
  codex-auth:
    external: true
    name: agent-box-codex-auth
  codex-auth-out:
    external: true
    name: agent-box-codex-auth-out

name: gm-sls-agent

# What every agent service shares. Each service adds only its own
# auth volumes, so neither agent can read the other's token. The home
# (CLAUDE_CONFIG_DIR, CODEX_HOME) is on the /home/node tmpfs and starts
# empty each run but for the auth file (D8, entrypoint.sh).
x-agent: &agent
  build: .
  user: "1000:1000"
  read_only: true
  tmpfs:
    - /tmp:exec,size=2g
    - /home/node:uid=1000,gid=1000,mode=0755
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 2048
  mem_limit: 8g
  stdin_open: true
  tty: true

x-auth-sync: &auth-sync
  build: .
  user: "1000:1000"
  read_only: true
  network_mode: none
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 64
  mem_limit: 256m
  entrypoint: ["/usr/local/bin/auth-sync"]

x-agent-env: &agent-env
  BRANCH: ${BRANCH:-}
  GIT_AUTHOR_NAME: ${AGENT_NAME:-}
  GIT_AUTHOR_EMAIL: ${AGENT_EMAIL:-}
  GIT_COMMITTER_NAME: ${AGENT_NAME:-}
  GIT_COMMITTER_EMAIL: ${AGENT_EMAIL:-}
  HTTP_PROXY: http://proxy:3128
  HTTPS_PROXY: http://proxy:3128
  http_proxy: http://proxy:3128
  https_proxy: http://proxy:3128
  NO_PROXY: localhost,127.0.0.1
  no_proxy: localhost,127.0.0.1

services:
  proxy:
    build: ./proxy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    networks: [egress, box]

  # Codex's proxy: its own allowlist, on a network only codex joins, under
  # the name proxy so the agent environment is the same for both.
  proxy-codex:
    build:
      context: ./proxy
      args:
        ALLOWLIST: allowlist-codex
        BOX_SUBNET: 10.77.1.0/24
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    networks:
      egress: {}
      box-codex:
        aliases: [proxy]

  agent:
    <<: *agent
    depends_on: [proxy]
    networks: [box]
    environment:
      <<: *agent-env
      CLAUDE_CONFIG_DIR: /home/node/.claude
      AGENT_AUTH: /home/node/.claude/.credentials.json
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      CLAUDE_CODE_DISABLE_AUTO_MEMORY: "1"
      DISABLE_AUTOUPDATER: "1"
    volumes:
      - workspace:/workspace
      - claude-auth:/auth:ro
      - claude-auth-out:/auth-out
      - pnpm-store:/home/node/.local/share/pnpm
      - ./bundles:/bundles:ro
      - ./managed-settings.json:/etc/claude-code/managed-settings.json:ro

  codex:
    <<: *agent
    depends_on: [proxy-codex]
    networks: [box-codex]
    command: ["codex"]
    environment:
      <<: *agent-env
      CODEX_HOME: /home/node/.codex
      AGENT_AUTH: /home/node/.codex/auth.json
    volumes:
      - workspace:/workspace
      - codex-auth:/auth:ro
      - codex-auth-out:/auth-out
      - pnpm-store:/home/node/.local/share/pnpm
      - ./bundles:/bundles:ro

  # Write a run's auth file back to its auth volume, after the agent's
  # container has exited (start.sh runs them). No network, and nothing
  # mounted but the two auth volumes of one agent.
  agent-auth-sync:
    <<: *auth-sync
    command: [".credentials.json"]
    volumes:
      - claude-auth:/auth
      - claude-auth-out:/auth-out

  codex-auth-sync:
    <<: *auth-sync
    command: ["auth.json"]
    volumes:
      - codex-auth:/auth
      - codex-auth-out:/auth-out

networks:
  box:
    internal: true
    ipam:
      config:
        - subnet: 10.77.0.0/24
  box-codex:
    internal: true
    ipam:
      config:
        - subnet: 10.77.1.0/24
  egress: {}

volumes:
  workspace: {}
  claude-auth: {}
  claude-auth-out: {}
  codex-auth: {}
  codex-auth-out: {}
  pnpm-store: {}
  # The kept homes from before D8. No service mounts them; they stay until
  # the auth volumes are verified, then go with docker volume rm.
  claude-config: {}
  codex-home: {}

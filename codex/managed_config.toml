# Codex defaults inside the box. Baked into the image at /etc/codex, on the
# read-only root, so the agent cannot rewrite them; $CODEX_HOME/config.toml
# is on a writable volume and Codex itself writes trust entries there.

# The container is the sandbox. Codex's bundled bwrap needs user
# namespaces, which the box does not grant (cap_drop ALL, default seccomp).
sandbox_mode = "danger-full-access"
approval_policy = "never"

# Hosted search runs on OpenAI's side and would bypass the proxy allowlist.
web_search = "disabled"

# Sign in with ChatGPT, like the Claude run's subscription login; the token
# lives in the codex-home volume as a file (there is no keyring in the box).
forced_login_method = "chatgpt"
cli_auth_credentials_store = "file"

check_for_update_on_startup = false

[analytics]
enabled = false

# D6: no agent memory in the box. Off by default in 0.164.0; pinned so a
# later default cannot turn it on. Codex still opens an empty
# memories_1.sqlite in CODEX_HOME at every start, whatever these say.
[features]
memories = false
# D7 (#5 follow-up): no background server. Codex 0.157.0+ starts one for
# interactive runs and runs it from a copy staged in CODEX_HOME; the noexec
# tmpfs home cannot exec it, and a self-updating copy has no place in a
# pinned box. Keep in step with managed_config.toml / requirements.toml.
daemon_auto_start = false
# D2: no ChatGPT apps or plugins in the box. Each would reach services
# (GitHub, Gmail, Drive, ...) through OpenAI's side, past the proxy
# allowlist. On by default in 0.164.0 except recommended_plugins; the
# coder's prompt offered seventeen remote plugins to install through
# tool_suggest. requirements.toml pins the same keys; this is the default.
apps = false
plugins = false
remote_plugin = false
plugin_sharing = false
recommended_plugins = false
tool_suggest = false

[memories]
generate_memories = false
use_memories = false
